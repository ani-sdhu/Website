<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhD Candidate, Political Science</title>
  <meta name="description" content="Personal academic website: energy politics, political economy, and quantitative methods.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a1f'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23f2a33a'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#viewer-body">Skip to content</a>

  <!-- ================= IDE VIEW ================= -->
  <div class="ide" id="ide">
    <header class="titlebar">
      <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="titlebar-path"><span class="bolt" aria-hidden="true">&#9889;</span> <span id="title-path">~/phd</span></div>
      <div class="titlebar-actions">
        <button class="tb-btn" type="button" data-cmd="theme()" title="Switch light and dark theme">theme()</button>
        <button class="tb-btn tb-primary" type="button" data-cmd="plain()" title="Open a classic, printable page">plain view</button>
      </div>
    </header>

    <main class="panes">
      <!-- Console -->
      <section class="pane pane-console" aria-label="R console">
        <div class="pane-tabs" role="tablist" aria-label="Console tabs">
          <span class="pane-tab active" role="tab" aria-selected="true">Console</span>
          <span class="pane-tab muted" role="tab" aria-selected="false" aria-disabled="true">Terminal</span>
          <span class="pane-meta" id="console-meta">R 4.5 &middot; ~/phd/</span>
        </div>
        <div class="console" id="console" tabindex="-1">
          <div class="console-out" id="console-out" aria-live="polite"></div>
          <form class="console-line" id="console-form" autocomplete="off">
            <label for="console-input" class="prompt">&gt;</label>
            <input id="console-input" class="console-input" type="text" spellcheck="false"
                   autocapitalize="off" autocorrect="off" aria-label="Type an R command, for example research()">
          </form>
        </div>
        <div class="chips" aria-label="Quick commands">
          <span class="chips-label">try:</span>
          <button type="button" class="chip" data-cmd="about()">about()</button>
          <button type="button" class="chip" data-cmd="research()">research()</button>
          <button type="button" class="chip" data-cmd="publications()">publications()</button>
          <button type="button" class="chip" data-cmd="methods()">methods()</button>
          <button type="button" class="chip" data-cmd="teaching()">teaching()</button>
          <button type="button" class="chip" data-cmd="cv()">cv()</button>
          <button type="button" class="chip" data-cmd="contact()">contact()</button>
          <button type="button" class="chip ghost" data-cmd="help()">help()</button>
        </div>
      </section>

      <!-- Environment -->
      <section class="pane pane-env" aria-label="Environment">
        <div class="pane-tabs" role="tablist" aria-label="Environment tabs">
          <button class="pane-tab active" type="button" role="tab" aria-selected="true" data-envtab="env">Environment</button>
          <button class="pane-tab" type="button" role="tab" aria-selected="false" data-envtab="history">History</button>
          <span class="pane-meta">Global Environment &#9662;</span>
        </div>
        <div class="env-body" id="env-body">
          <div class="env-group">Values</div>
          <table class="env-table" id="env-table">
            <caption class="sr-only">Site sections. Select one to open it in the Viewer.</caption>
            <tbody></tbody>
          </table>
        </div>
        <div class="env-body hidden" id="history-body">
          <ol class="history-list" id="history-list"></ol>
        </div>
      </section>

      <!-- Viewer -->
      <section class="pane pane-viewer" aria-label="Viewer">
        <div class="pane-tabs" role="tablist" aria-label="Viewer tabs">
          <button class="pane-tab active" type="button" role="tab" aria-selected="true" data-vtab="viewer">Viewer</button>
          <button class="pane-tab" type="button" role="tab" aria-selected="false" data-vtab="files">Files</button>
          <button class="pane-tab" type="button" role="tab" aria-selected="false" data-vtab="packages">Packages</button>
          <button class="pane-tab" type="button" role="tab" aria-selected="false" data-vtab="help">Help</button>
          <span class="pane-meta" id="viewer-meta"></span>
        </div>
        <div class="viewer-body" id="viewer-body" tabindex="-1"></div>
      </section>
    </main>

    <footer class="statusbar">
      <span class="status-dot" aria-hidden="true"></span>
      <span>grid: connected</span>
      <span class="sep">|</span>
      <span id="status-obj">about</span>
      <span class="status-right">click an object, or type <code>help()</code></span>
    </footer>
  </div>

  <!-- ================= PLAIN VIEW ================= -->
  <div class="plain hidden" id="plain" aria-label="Plain view"></div>

  <noscript>
    <p style="padding:2rem;font-family:serif">This site uses JavaScript for its interactive console. A PDF of my CV is at <a href="files/cv.pdf">files/cv.pdf</a>.</p>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
