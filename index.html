<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anitesh Sandhu</title>
  <meta name="description" content="Anitesh Sandhu, Ph.D. student in Political Science and International Affairs at the University of Georgia. Energy markets, utility regulation, and quantitative methods.">
  <script>
    /* Set theme before paint to avoid a flash. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Ubuntu Mono is the fixed-width fallback RStudio uses outside macOS and Windows. -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a1f'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23f2a33a'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#about" aria-label="Back to top">
        <span class="bolt" aria-hidden="true">&#9889;</span>
        <span class="brand-name" id="brand-name"></span>
      </a>
      <nav class="tabs" id="nav" aria-label="Sections"></nav>
      <div class="tools">
        <button type="button" class="tool" id="theme-btn" aria-label="Switch light or dark theme" title="Light or dark">
          <span aria-hidden="true">&#9680;</span>
        </button>
        <button type="button" class="tool tool-console" id="console-btn" aria-controls="console" aria-expanded="false" title="Open the R console (Ctrl+2)">
          <span class="prompt-glyph" aria-hidden="true">&gt;_</span><span class="tool-label">Console</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="statusbar">
    <div class="statusbar-inner">
      <span class="status-dot" aria-hidden="true"></span>
      <span>grid: connected</span>
      <span class="sep" aria-hidden="true">|</span>
      <span id="footer-copy"></span>
      <span class="status-right">Built in plain HTML. Styled after an R session.</span>
    </div>
  </footer>

  <!-- Optional R console drawer -->
  <section class="console" id="console" aria-label="R console" hidden>
    <div class="console-head">
      <span class="console-tab">Console</span>
      <span class="console-path">~/phd/</span>
      <span class="console-hint">try <code>research()</code> or <code>help()</code></span>
      <button type="button" class="console-close" id="console-close" aria-label="Close console">&times;</button>
    </div>
    <div class="console-scroll" id="console-scroll">
      <div class="console-out" id="console-out" aria-live="polite"></div>
      <form class="console-line" id="console-form" autocomplete="off">
        <label for="console-input" class="prompt">&gt;</label>
        <input id="console-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off"
               aria-label="Type an R command, for example research()">
      </form>
    </div>
  </section>

  <noscript>
    <p style="max-width:40rem;margin:3rem auto;font-family:Georgia,serif">This site needs JavaScript to display. My CV is at <a href="files/cv.pdf">files/cv.pdf</a>.</p>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
